name: Daily US Lead Discovery

on:
  schedule:
    # Runs daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  find-leads:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Lead Discovery Cycle
        run: |
          python main.py auto-find

      - name: Commit and push updated lead sheets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add leads.csv leads.xlsx leads.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: Added fresh US leads [skip ci]" && git push)

